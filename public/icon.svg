<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="#181818" />
  <!-- Windows 4 Panes in center -->
  <g transform="translate(136, 136)">
    <rect x="0" y="0" width="112" height="112" rx="12" fill="#38bdf8" />
    <rect x="128" y="0" width="112" height="112" rx="12" fill="#0284c7" />
    <rect x="0" y="128" width="112" height="112" rx="12" fill="#0369a1" />
    <rect x="128" y="128" width="112" height="112" rx="12" fill="#0284c7" />
  </g>
  <!-- Bicycle / Keirin wheel accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="30 20" opacity="0.6"/>
